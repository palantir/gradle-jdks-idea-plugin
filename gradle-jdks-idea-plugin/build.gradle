apply plugin: 'java'
apply plugin: 'com.palantir.external-publish-intellij'

repositories {
    intellijPlatform {
        defaultRepositories()
    }
}

dependencies {
    intellijPlatform {
        intellijIdeaCommunity('2024.1') {
            useInstaller = false
        }
        bundledPlugins('com.intellij.java', 'org.jetbrains.plugins.gradle')
    }
}

intellijPlatform {
    projectName = 'palantir-gradle-jdks'
    pluginConfiguration {
        description = 'Configures the Gradle JDKs for the Toolchains used for a project and for the Gradle Daemon.'
        ideaVersion {
            // sinceBuild derives from the intellijIdeaCommunity() version
            untilBuild = provider { null }
        }
    }
    pluginVerification {
        ides {
            create('IC', '2024.1')
            create('IU', '2025.3.6.1')
            create('IU', '2026.2.2')
        }
    }
}

// Javadoc fails if there are no public classes to javadoc, so make it stop complaining.
tasks.named("javadoc", Javadoc) {
    failOnError = false
}

tasks.withType(JavaCompile).configureEach {
    options.errorprone.disable 'PreferSafeLoggableExceptions'
}

javaVersion {
    target = 17
    runtime = 17
}
