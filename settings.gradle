buildscript {
    repositories {
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        classpath 'com.palantir.gradle.jdks:gradle-jdks-settings:0.67.0'
    }
}
apply plugin: 'com.palantir.jdks.settings'
rootProject.name = 'gradle-jdks-idea-plugin-root'

include 'gradle-jdks-idea-plugin'
